<!-- ── SLIDER ── (los slides se generan desde los juegos con "featured": true) -->
<section class="slider" id="slider">
  <div id="slides"></div>

  <div class="slider-controls">
    <div class="slider-dots" id="slider-dots"></div>
    <div class="slider-arrows">
      <button class="arrow-btn" id="prev" aria-label="Anterior">&#8592;</button>
      <button class="arrow-btn" id="next" aria-label="Siguiente">&#8594;</button>
    </div>
    <span class="slider-counter" id="counter"></span>
  </div>

  <div class="slider-progress" id="progress"></div>
</section>
